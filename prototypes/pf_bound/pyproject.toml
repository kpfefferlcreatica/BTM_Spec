[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pf-bound"
version = "0.1.0"
description = "Policy-restricted foresight bound for the BTM Planner (throwaway prototype, not normative)"
requires-python = ">=3.11"
dependencies = ["gurobipy>=11", "numpy", "pandas", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
